---
- name: Enroll IPA clients in lab.shared
  hosts: ipa_client
  become: true

  pre_tasks:
    - name: Require an IPA server in the inventory
      ansible.builtin.assert:
        that:
          - groups.get('ipa_server', []) | length > 0
        fail_msg: Define at least one IPA server by its FQDN in the ipa_server inventory group.

  roles:
    - role: freeipa.ansible_freeipa.ipaclient
      state: present
